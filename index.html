<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="description" content="Há mais de 10 anos no mercado brasileiro, a Transvictor Transportes oferece soluções em logística com compromisso, eficiência e disponibilidade 24 horas.">
  <meta name="theme-color" content="#07111B">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Transvictor Transportes | Soluções em Transportes e Logística">
  <meta property="og:description" content="Há mais de 10 anos no mercado brasileiro, a Transvictor Transportes oferece soluções em logística com compromisso, eficiência e disponibilidade 24 horas.">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Fonte: Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

  <!-- Globo: pré-carrega a versão principal para evitar atraso no LCP -->
  <link rel="preload" as="image" href="assets/globe.avif" type="image/avif" fetchpriority="high">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <!-- ===== Camada decorativa: globo + rota animada (mesmo sistema de coordenadas 1000×1000) ===== -->
    <div class="hero__visual">
      <div class="globe" data-globe>
        <picture>
          <source srcset="assets/globe.avif" type="image/avif">
          <source srcset="assets/globe-900.webp 900w, assets/globe.webp 1800w" sizes="(max-width: 767px) 160vw, (max-width: 1023px) 105vw, 69vw" type="image/webp">
          <img class="globe__img" src="assets/globe.webp" width="1800" height="1800" alt="" aria-hidden="true" decoding="async" fetchpriority="high">
        </picture>

        <svg class="route" viewBox="0 0 1000 1000" role="img" aria-label="Rota de expansão: do Brasil, atuação atual, para os Estados Unidos, expansão futura.">
          <defs>
            <linearGradient id="routeGrad" gradientUnits="userSpaceOnUse" x1="706" y1="628" x2="411" y2="277">
              <stop offset="0" stop-color="#D9AB52"/>
              <stop offset="1" stop-color="#F5CB70"/>
            </linearGradient>
            <radialGradient id="markerGlow">
              <stop offset="0" stop-color="#F5CB70" stop-opacity="0.75"/>
              <stop offset="0.45" stop-color="#D9AB52" stop-opacity="0.25"/>
              <stop offset="1" stop-color="#D9AB52" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="headGlow">
              <stop offset="0" stop-color="#FFF1C9" stop-opacity="1"/>
              <stop offset="0.3" stop-color="#F5CB70" stop-opacity="0.6"/>
              <stop offset="1" stop-color="#F5CB70" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Trilha discreta (sempre visível) -->
          <path id="routeTrack" class="route__track" d="M705.6,628.2 L705.3,616.6 L704.8,605.1 L704.2,593.5 L703.4,582.0 L702.4,570.5 L701.2,559.0 L699.7,547.6 L698.0,536.2 L696.0,525.0 L693.8,513.9 L691.2,503.0 L688.4,492.2 L685.3,481.6 L681.8,471.1 L678.0,460.9 L673.9,450.9 L669.4,441.1 L664.6,431.6 L659.4,422.3 L653.9,413.3 L648.0,404.5 L641.8,396.1 L635.2,387.9 L628.3,380.0 L621.1,372.4 L613.5,365.1 L605.5,358.1 L597.3,351.4 L588.7,345.0 L579.9,338.9 L570.7,333.1 L561.3,327.6 L551.6,322.3 L541.7,317.4 L531.5,312.7 L521.2,308.3 L510.6,304.2 L499.9,300.3 L489.0,296.6 L478.0,293.2 L466.9,290.0 L455.7,287.0 L444.5,284.2 L433.2,281.5 L421.9,279.1 L410.6,276.8"/>

          <!-- Rota desenhada (halo + linha). pathLength=1 normaliza o dasharray -->
          <path class="route__glow" pathLength="1" data-route d="M705.6,628.2 L705.3,616.6 L704.8,605.1 L704.2,593.5 L703.4,582.0 L702.4,570.5 L701.2,559.0 L699.7,547.6 L698.0,536.2 L696.0,525.0 L693.8,513.9 L691.2,503.0 L688.4,492.2 L685.3,481.6 L681.8,471.1 L678.0,460.9 L673.9,450.9 L669.4,441.1 L664.6,431.6 L659.4,422.3 L653.9,413.3 L648.0,404.5 L641.8,396.1 L635.2,387.9 L628.3,380.0 L621.1,372.4 L613.5,365.1 L605.5,358.1 L597.3,351.4 L588.7,345.0 L579.9,338.9 L570.7,333.1 L561.3,327.6 L551.6,322.3 L541.7,317.4 L531.5,312.7 L521.2,308.3 L510.6,304.2 L499.9,300.3 L489.0,296.6 L478.0,293.2 L466.9,290.0 L455.7,287.0 L444.5,284.2 L433.2,281.5 L421.9,279.1 L410.6,276.8"/>
          <path class="route__line" pathLength="1" data-route d="M705.6,628.2 L705.3,616.6 L704.8,605.1 L704.2,593.5 L703.4,582.0 L702.4,570.5 L701.2,559.0 L699.7,547.6 L698.0,536.2 L696.0,525.0 L693.8,513.9 L691.2,503.0 L688.4,492.2 L685.3,481.6 L681.8,471.1 L678.0,460.9 L673.9,450.9 L669.4,441.1 L664.6,431.6 L659.4,422.3 L653.9,413.3 L648.0,404.5 L641.8,396.1 L635.2,387.9 L628.3,380.0 L621.1,372.4 L613.5,365.1 L605.5,358.1 L597.3,351.4 L588.7,345.0 L579.9,338.9 L570.7,333.1 L561.3,327.6 L551.6,322.3 L541.7,317.4 L531.5,312.7 L521.2,308.3 L510.6,304.2 L499.9,300.3 L489.0,296.6 L478.0,293.2 L466.9,290.0 L455.7,287.0 L444.5,284.2 L433.2,281.5 L421.9,279.1 L410.6,276.8"/>

          <!-- Seta apontando para os EUA (orientação recalculada no script.js) -->
          <path class="route__arrow" data-arrow d="M0,0 L-15,-7.5 L-11,0 L-15,7.5 Z" transform="translate(410.6 276.8) rotate(191)"/>

          <!-- Cabeça luminosa que percorre a rota -->
          <g class="route__head" data-head opacity="0">
            <circle r="22" fill="url(#headGlow)"/>
            <circle r="3.2" fill="#FFF4D6"/>
          </g>

          <!-- Marcador: Brasil (origem) -->
          <g class="marker marker--br" data-marker-br transform="translate(705.7 639.6)">
            <circle class="marker__glow" r="34" fill="url(#markerGlow)"/>
            <circle class="marker__ring" r="11"/>
            <circle class="marker__core" r="5.5"/>
          </g>

          <!-- Marcador: Estados Unidos (destino) -->
          <g class="marker marker--us" data-marker-us transform="translate(399.3 274.6)">
            <circle class="marker__pulse" data-pulse r="11"/>
            <circle class="marker__glow" r="34" fill="url(#markerGlow)"/>
            <circle class="marker__ring" r="11"/>
            <circle class="marker__core" r="5.5"/>
          </g>

          <!-- Rótulos -->
          <g class="label" aria-hidden="true">
            <polyline class="label__line" points="713,631 758,588 772,588"/>
            <circle class="label__dot" cx="772" cy="588" r="2"/>
            <text class="label__title" x="782" y="583">Brasil</text>
            <text class="label__sub" x="782" y="608">Atuação atual</text>
          </g>
          <g class="label" aria-hidden="true">
            <polyline class="label__line" points="405,266 432,214 446,214"/>
            <circle class="label__dot" cx="446" cy="214" r="2"/>
            <text class="label__title" x="456" y="209">Estados Unidos</text>
            <text class="label__sub" x="456" y="234">Expansão futura</text>
          </g>
        </svg>
      </div>
    </div>

    <!-- ===== Conteúdo ===== -->
    <div class="hero__container">
      <header class="hero__brand reveal">
        <img class="logo" src="assets/logo-transvictor.svg" width="402" height="88" alt="Transvictor — Soluções em Transportes">
      </header>

      <div class="hero__content">
        <h1 class="hero__title reveal">
          <span class="hero__title-line">Soluções em</span>
          <span class="hero__title-line hero__title-line--gold">Transportes</span>
        </h1>

        <p class="hero__text reveal">
          Há mais de 10 anos no mercado brasileiro, a Transvictor Transportes oferece soluções em logística, conectando operações e movimentando negócios com compromisso, eficiência e disponibilidade 24 horas.
        </p>

        <div class="hero__actions reveal">
          <a class="btn btn--primary" href="tel:+5511974801936" aria-label="Ligar para a Transvictor Transportes: (11) 97480-1936">
            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/>
            </svg>
            <span>Telefone</span>
          </a>
          <a class="btn btn--outline" href="mailto:diretoria@transvictor.com.br" aria-label="Enviar e-mail para diretoria@transvictor.com.br">
            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>E-mail</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
